<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓之谷遠征隊 - 即時同步報名與組隊系統</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .status-bar {
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 15px;
            padding: 6px;
            border-radius: 6px;
            background-color: #e3f2fd;
            color: #0d47a1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            background: #fff;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .checkbox-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1976D2;
        }
        .btn-group-teams {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-team-gen {
            background-color: #4CAF50;
            flex: 1;
        }
        .btn-team-gen:hover {
            background-color: #388E3C;
        }
        .btn-team-copy {
            background-color: #FF9800;
            flex: 1;
        }
        .btn-team-copy:hover {
            background-color: #F57C00;
        }
        .btn-stat-copy {
            background-color: #9C27B0;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn-stat-copy:hover {
            background-color: #7B1FA2;
        }
        .btn-action-group {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .btn-edit {
            background-color: #FF9800;
            width: auto;
            padding: 6px 10px;
            font-size: 0.85em;
        }
        .btn-edit:hover {
            background-color: #E65100;
        }
        .btn-danger {
            background-color: #f44336;
            width: auto;
            padding: 6px 10px;
            font-size: 0.85em;
        }
        .btn-danger:hover {
            background-color: #d32f2f;
        }
        .btn-clear-all {
            background-color: #e53935;
            float: right;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f1f3f5;
        }
        .team-box {
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f9fbf9;
        }
        .stat-box {
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f4f9ff;
        }
        .team-title {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .stat-title {
            font-weight: bold;
            color: #1565c0;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .missing-warning {
            color: #d32f2f;
            font-weight: bold;
            background-color: #ffebee;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-left: 8px;
        }
        .backup-text {
            color: #795548;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #ccc;
        }
        .clear {
            clear: both;
        }

        /* Modal 彈出視窗樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-secondary {
            background-color: #78909C;
        }
        .btn-secondary:hover {
            background-color: #546E7A;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>楓之谷遠征隊報名與自動組隊系統</h1>
    <div class="status-bar" id="syncStatus">🔄 正在連線至雲端資料庫...</div>

    <!-- 1. 報名表單 -->
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h2>1. 填寫報名資料</h2>
        <div class="form-group">
            <label for="playerName">玩家暱稱：</label>
            <input type="text" id="playerName" placeholder="請輸入遊戲名稱">
        </div>
        <div class="form-group">
            <label for="playerLevel">玩家等級：</label>
            <input type="number" id="playerLevel" placeholder="請輸入等級 (例如: 150)" min="1" max="300">
        </div>
        <div class="form-group">
            <label for="playerJob">職業：</label>
            <select id="playerJob">
                <option value="主教">主教</option>
                <option value="英雄">英雄</option>
                <option value="黑騎士">黑騎士</option>
                <option value="聖騎士">聖騎士</option>
                <option value="箭神">箭神</option>
                <option value="神射手">神射手</option>
                <option value="標賊">標賊</option>
                <option value="刀賊">刀賊</option>
                <option value="拳霸">拳霸</option>
                <option value="槍神">槍神</option>
                <option value="火毒">火毒</option>
                <option value="冰雷">冰雷</option>
            </select>
        </div>
        <div class="form-group">
            <label for="playerRuns">可參加場數：</label>
            <input type="number" id="playerRuns" placeholder="請輸入可參加場數 (預設: 1)" min="1" max="20" value="1">
        </div>
        <div class="form-group">
            <label>可參加日期：</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="timeSlot" value="週二"> 週二</label>
                <label><input type="checkbox" name="timeSlot" value="週三"> 週三</label>
                <label><input type="checkbox" name="timeSlot" value="週四"> 週四</label>
                <label><input type="checkbox" name="timeSlot" value="週五"> 週五</label>
                <label><input type="checkbox" name="timeSlot" value="週六"> 週六</label>
                <label><input type="checkbox" name="timeSlot" value="週日"> 週日</label>
                <label><input type="checkbox" name="timeSlot" value="週一"> 週一</label>
            </div>
        </div>
        <button onclick="submitRegistration()">提交報名</button>
    </div>

    <!-- 2. 目前報名名單 -->
    <div>
        <button class="btn-danger btn-clear-all" onclick="clearAllData()">🗑️ 清空所有名單 (需密碼)</button>
        <h2 style="text-align: left;">2. 目前報名名單 (共 <span id="playerCount">0</span> 人)</h2>
        <div class="clear"></div>
        <table>
            <thead>
                <tr>
                    <th>序號</th>
                    <th>玩家暱稱</th>
                    <th>等級</th>
                    <th>職業</th>
                    <th>可參加場數</th>
                    <th>可參加日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                <tr><td colspan="7">載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 3. 自動組隊功能 -->
    <div style="margin-top: 30px;">
        <h2>3. 自動組隊分析</h2>
        <div class="btn-group-teams">
            <button class="btn-team-gen" onclick="generateTeams()">產生最佳組隊名單</button>
            <button class="btn-team-copy" onclick="copyTeamsText()">📋 複製組隊名單 (文字格式)</button>
        </div>
        <div id="teamResults" style="margin-top: 20px;"></div>
    </div>

    <!-- 4. 每日可參加人員統計 -->
    <div style="margin-top: 30px;">
        <h2>4. 每日可參加人員統計 (週二 ~ 週一)</h2>
        <button class="btn-stat-copy" onclick="copyDailyStatsText()">📋 複製每日統計 (文字格式)</button>
        <div id="dailyStatResults"></div>
    </div>
</div>

<!-- 編輯視窗 Modal -->
<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top: 0;">✏️ 編輯玩家報名資料</h2>
        <p>玩家：<strong id="editPlayerNameText"></strong> (<span id="editPlayerJobText"></span>)</p>
        
        <div class="form-group">
            <label for="editRuns">可參加場數：</label>
            <input type="number" id="editRuns" min="1" max="20">
        </div>

        <div class="form-group">
            <label>可參加日期：</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="editTimeSlot" value="週二"> 週二</label>
                <label><input type="checkbox" name="editTimeSlot" value="週三"> 週三</label>
                <label><input type="checkbox" name="editTimeSlot" value="週四"> 週四</label>
                <label><input type="checkbox" name="editTimeSlot" value="週五"> 週五</label>
                <label><input type="checkbox" name="editTimeSlot" value="週六"> 週六</label>
                <label><input type="checkbox" name="editTimeSlot" value="週日"> 週日</label>
                <label><input type="checkbox" name="editTimeSlot" value="週一"> 週一</label>
            </div>
        </div>

        <div class="modal-footer">
            <button style="flex:1" onclick="savePlayerEdit()">儲存更新</button>
            <button style="flex:1" class="btn-secondary" onclick="closeEditModal()">取消</button>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBs2AIpmqDMMNvIuLBr2fjCbDTzbED3XCM",
        authDomain: "maple-test-a3ba4.firebaseapp.com",
        databaseURL: "https://maple-test-a3ba4-default-rtdb.firebaseio.com",
        projectId: "maple-test-a3ba4",
        storageBucket: "maple-test-a3ba4.firebasestorage.app",
        messagingSenderId: "352071996272",
        appId: "1:352071996272:web:2aae58f9118c82aeba35b5",
        measurementId: "G-G4JG7VH65R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, 'maple_players');

    const DAYS_ORDER = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];

    let players = [];
    let currentEditIndex = null;

    onValue(playersRef, (snapshot) => {
        const data = snapshot.val();
        players = data ? data : [];
        updateUI();
        generateDailyStats();
        document.getElementById('syncStatus').innerText = "🟢 已與雲端資料庫同步（即時連線中）";
        document.getElementById('syncStatus').style.backgroundColor = "#e8f5e9";
        document.getElementById('syncStatus').style.color = "#2e7d32";
    }, (error) => {
        console.error("Firebase Sync Error:", error);
        document.getElementById('syncStatus').innerText = "🔴 連線失敗，請檢查 Realtime Database 開通與規則設定";
        document.getElementById('syncStatus').style.backgroundColor = "#ffebee";
        document.getElementById('syncStatus').style.color = "#c62828";
    });

    function saveToFirebase(newPlayers) {
        set(playersRef, newPlayers);
    }

    window.submitRegistration = function() {
        const nameInput = document.getElementById('playerName');
        const levelInput = document.getElementById('playerLevel');
        const runsInput = document.getElementById('playerRuns');
        
        const name = nameInput.value.trim();
        const level = levelInput.value.trim();
        const runs = runsInput.value.trim() || "1";
        const job = document.getElementById('playerJob').value;
        const timeBoxes = document.querySelectorAll('input[name="timeSlot"]:checked');
        
        const selectedTimes = Array.from(timeBoxes).map(cb => cb.value);
        const times = DAYS_ORDER.filter(day => selectedTimes.includes(day));

        if (!name) {
            alert("請輸入玩家暱稱！");
            return;
        }
        if (!level) {
            alert("請輸入玩家等級！");
            return;
        }
        if (times.length === 0) {
            alert("請至少選擇一個可參加日期！");
            return;
        }

        const newPlayer = { name, level, job, runs, times };
        const updatedPlayers = [...players, newPlayer];
        
        saveToFirebase(updatedPlayers);

        nameInput.value = '';
        levelInput.value = '';
        runsInput.value = '1';
        timeBoxes.forEach(cb => cb.checked = false);
    };

    window.openEditModal = function(index) {
        currentEditIndex = index;
        const p = players[index];
        
        document.getElementById('editPlayerNameText').innerText = p.name;
        document.getElementById('editPlayerJobText').innerText = `Lv.${p.level || '-'} ${p.job}`;
        document.getElementById('editRuns').value = p.runs || 1;

        const editTimeBoxes = document.querySelectorAll('input[name="editTimeSlot"]');
        editTimeBoxes.forEach(cb => {
            cb.checked = p.times && p.times.includes(cb.value);
        });

        document.getElementById('editModal').style.display = 'flex';
    };

    window.closeEditModal = function() {
        document.getElementById('editModal').style.display = 'none';
        currentEditIndex = null;
    };

    window.savePlayerEdit = function() {
        if (currentEditIndex === null) return;

        const newRuns = document.getElementById('editRuns').value.trim() || "1";
        const editTimeBoxes = document.querySelectorAll('input[name="editTimeSlot"]:checked');
        const selectedTimes = Array.from(editTimeBoxes).map(cb => cb.value);
        const newTimes = DAYS_ORDER.filter(day => selectedTimes.includes(day));

        if (newTimes.length === 0) {
            alert("請至少選擇一個可參加日期！");
            return;
        }

        const updatedPlayers = [...players];
        updatedPlayers[currentEditIndex] = {
            ...updatedPlayers[currentEditIndex],
            runs: newRuns,
            times: newTimes
        };

        saveToFirebase(updatedPlayers);
        closeEditModal();
    };

    window.deletePlayer = function(index) {
        if (confirm(`確定要刪除 ${players[index].name} 嗎？`)) {
            const updatedPlayers = players.filter((_, i) => i !== index);
            saveToFirebase(updatedPlayers);
        }
    };

    window.clearAllData = function() {
        const passphrase = prompt("請輸入重置金鑰/密碼以清空名單：");
        if (passphrase === "SMD") {
            if (confirm("確認要清空所有已報名的玩家資料嗎？此操作無法復原！")) {
                saveToFirebase([]);
            }
        } else if (passphrase !== null) {
            alert("密碼錯誤！無法清空資料。");
        }
    };

    function updateUI() {
        const tbody = document.getElementById('playerTableBody');
        document.getElementById('playerCount').innerText = players.length;
        tbody.innerHTML = '';

        if (players.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7">目前尚無人報名</td></tr>';
            return;
        }

        players.forEach((p, index) => {
            const sortedTimes = DAYS_ORDER.filter(day => p.times && p.times.includes(day));
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(p.name)}</td>
                <td>Lv.${escapeHtml(p.level || '-')}</td>
                <td>${escapeHtml(p.job)}</td>
                <td>${escapeHtml(p.runs || '1')} 場</td>
                <td>${sortedTimes.join(', ')}</td>
                <td>
                    <div class="btn-action-group">
                        <button class="btn-edit" onclick="openEditModal(${index})">✏️ 編輯</button>
                        <button class="btn-danger" onclick="deletePlayer(${index})">🗑️ 刪除</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function generateDailyStats() {
        const statDiv = document.getElementById('dailyStatResults');
        statDiv.innerHTML = '';

        if (players.length === 0) {
            statDiv.innerHTML = '<p style="color: #666;">目前尚無人報名資料可統計。</p>';
            return;
        }

        DAYS_ORDER.forEach(day => {
            const available = players.filter(p => p.times && p.times.includes(day));
            
            let html = `<div class="stat-box">
                <div class="stat-title">📅 ${day} (可參加：${available.length} 人)</div>`;

            if (available.length === 0) {
                html += `<p style="color: #888; margin: 5px 0;">無人報名此時段。</p>`;
            } else {
                const jobCounts = {};
                available.forEach(p => {
                    jobCounts[p.job] = (jobCounts[p.job] || 0) + 1;
                });

                const jobSummaryText = Object.entries(jobCounts)
                    .map(([job, count]) => `${job} x${count}`)
                    .join('、 ');

                const playerNamesText = available
                    .map(p => `${p.name} (Lv.${p.level || '-'} ${p.job} / ${p.runs || 1}場)`)
                    .join('、 ');

                html += `<p style="margin: 5px 0;"><strong>成員名單：</strong> ${playerNamesText}</p>`;
                html += `<p style="margin: 5px 0; color: #555; font-size: 0.95em;"><strong>職業分布：</strong> ${jobSummaryText}</p>`;
            }

            html += `</div>`;
            statDiv.innerHTML += html;
        });
    }

    window.copyDailyStatsText = function() {
        if (players.length === 0) {
            alert("目前尚無報名資料可複製！");
            return;
        }

        let outputText = "📊 【楓之谷遠征隊 每日可參加人員統計】 📊\n\n";

        DAYS_ORDER.forEach(day => {
            const available = players.filter(p => p.times && p.times.includes(day));
            outputText += `📅 【${day}】 (共 ${available.length} 人)\n`;

            if (available.length === 0) {
                outputText += `  └ ⚠️ 無人報名此時段。\n\n`;
            } else {
                const jobCounts = {};
                available.forEach(p => {
                    jobCounts[p.job] = (jobCounts[p.job] || 0) + 1;
                });

                const jobSummaryText = Object.entries(jobCounts)
                    .map(([job, count]) => `${job} x${count}`)
                    .join('、 ');

                const playerNamesText = available
                    .map(p => `${p.name} (Lv.${p.level || '-'} ${p.job} / ${p.runs || 1}場)`)
                    .join('、 ');

                outputText += `  - 成員：${playerNamesText}\n`;
                outputText += `  - 職業分布：${jobSummaryText}\n\n`;
            }
        });

        navigator.clipboard.writeText(outputText).then(() => {
            alert("✅ 每日統計文字已成功複製到剪貼簿！");
        }).catch(err => {
            console.error("複製失敗：", err);
            alert("複製失敗，請手動選取文字。");
        });
    };

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }

    window.generateTeams = function() {
        const resultsDiv = document.getElementById('teamResults');
        resultsDiv.innerHTML = '';

        if (players.length === 0) {
            resultsDiv.innerHTML = '<p style="color: red;">目前沒有報名名單可供組隊！</p>';
            return;
        }

        DAYS_ORDER.forEach(day => {
            const slotPlayers = players.filter(p => p.times && p.times.includes(day));
            if (slotPlayers.length === 0) return;

            const result = buildTeamsForSlot(slotPlayers);

            let html = `<div class="team-box">
                <div class="team-title">📅 日期：${day} (該日共 ${slotPlayers.length} 人報名)</div>`;

            if (result.teams.length === 0) {
                html += `<p style="color: #666;">無人報名此時段。</p>`;
            } else {
                result.teams.forEach((tObj, tIdx) => {
                    const team = tObj.players;
                    let warningHtml = "";
                    if (tObj.missingNote) {
                        warningHtml = `<span class="missing-warning">⚠️ ${tObj.missingNote}</span>`;
                    }

                    html += `<p><strong>隊伍 ${tIdx + 1} (${team.length}人)：</strong> ${team.map(p => `${p.name} (Lv.${p.level || '-'} ${p.job} / ${p.runs || 1}場)`).join('、 ')} ${warningHtml}</p>`;
                });

                if (result.backups.length > 0) {
                    html += `<p class="backup-text">替補/未入隊 (${result.backups.length}人)：${result.backups.map(p => `${p.name} (Lv.${p.level || '-'} ${p.job} / ${p.runs || 1}場)`).join('、 ')}</p>`;
                }
            }

            html += `</div>`;
            resultsDiv.innerHTML += html;
        });
    };

    window.copyTeamsText = function() {
        if (players.length === 0) {
            alert("目前尚無報名資料可複製！");
            return;
        }

        let outputText = "⚔️ 【楓之谷遠征隊 最佳組隊名單】 ⚔️\n\n";
        let hasAnyTeam = false;

        DAYS_ORDER.forEach(day => {
            const slotPlayers = players.filter(p => p.times && p.times.includes(day));
            if (slotPlayers.length === 0) return;

            hasAnyTeam = true;
            const result = buildTeamsForSlot(slotPlayers);

            outputText += `📅 【${day}】 (共 ${slotPlayers.length} 人報名)\n`;

            if (result.teams.length === 0) {
                outputText += `  └ ⚠️ 無人報名此時段。\n\n`;
            } else {
                result.teams.forEach((tObj, tIdx) => {
                    const team = tObj.players;
                    let noteText = tObj.missingNote ? ` [⚠️ ${tObj.missingNote}]` : "";
                    outputText += `  ▶ 隊伍 ${tIdx + 1} (${team.length}人)${noteText}：\n`;
                    team.forEach((p, pIdx) => {
                        outputText += `    ${pIdx + 1}. ${p.name} (Lv.${p.level || '-'} ${p.job} / ${p.runs || 1}場)\n`;
                    });
                });

                if (result.backups.length > 0) {
                    outputText += `  替補/未入隊 (${result.backups.length}人)：${result.backups.map(p => `${p.name} (Lv.${p.level || '-'} ${p.job} / ${p.runs || 1}場)`).join('、 ')}\n`;
                }
                outputText += "\n";
            }
        });

        if (!hasAnyTeam) {
            alert("目前尚無任何可進行組隊的資料！");
            return;
        }

        navigator.clipboard.writeText(outputText).then(() => {
            alert("✅ 組隊文字已成功複製到剪貼簿！可直接貼上至群組。");
        }).catch(err => {
            console.error("複製失敗：", err);
            alert("複製失敗，請手動選取文字。");
        });
    };

    function buildTeamsForSlot(availablePlayers) {
        let pool = [...availablePlayers];
        
        // 全場 12 人團隊上限 (隊伍 1 + 隊伍 2 合計)
        const RAID_LIMITS = {
            "拳霸": 1,
            "黑騎士": 2,
            "神射手": 1,
            "標賊": 1,
            "槍神": 1,
            "主教": 1,
            "火毒": 1,
            "冰雷": 1
        };

        // 單隊上限 (最多6人)
        const SINGLE_TEAM_LIMITS = {
            "英雄": 2,
            "刀賊": 2,
            "拳霸": 1,
            "黑騎士": 2,
            "神射手": 1,
            "標賊": 1,
            "槍神": 1,
            "主教": 1,
            "火毒": 1,
            "冰雷": 1
        };

        let raidJobCounts = {};
        let teams = [];

        // 預先決定需要幾隊（只要大於 6 人就必須分隊 1 與隊伍 2，最多 2 隊 12 人）
        let targetTeamCount = 1;
        if (pool.length > 6) {
            targetTeamCount = 2;
        }

        for (let teamIdx = 0; teamIdx < targetTeamCount; teamIdx++) {
            let currentTeam = [];
            let singleTeamJobCounts = {};

            // 檢查能否把此球員放入當前隊伍（同時通過全場限制與單隊限制）
            function canAddPlayer(player) {
                const job = player.job;

                // 1. 英雄與刀賊：單隊合計最多 2 人
                if (job === "英雄" || job === "刀賊") {
                    const meleeInTeam = (singleTeamJobCounts["英雄"] || 0) + (singleTeamJobCounts["刀賊"] || 0);
                    if (meleeInTeam >= 2) return false;
                }

                // 2. 檢查全場 12 人上限
                if (RAID_LIMITS[job] !== undefined) {
                    if ((raidJobCounts[job] || 0) >= RAID_LIMITS[job]) return false;
                }

                // 3. 檢查單隊 6 人上限
                if (SINGLE_TEAM_LIMITS[job] !== undefined) {
                    if ((singleTeamJobCounts[job] || 0) >= SINGLE_TEAM_LIMITS[job]) return false;
                }

                return true;
            }

            // 步驟 A: 優先放入核心近戰 (英雄 / 刀賊)
            const coreIndex = pool.findIndex(p => (p.job === "英雄" || p.job === "刀賊") && canAddPlayer(p));
            if (coreIndex !== -1) {
                const corePlayer = pool.splice(coreIndex, 1)[0];
                currentTeam.push(corePlayer);
                singleTeamJobCounts[corePlayer.job] = (singleTeamJobCounts[corePlayer.job] || 0) + 1;
                raidJobCounts[corePlayer.job] = (raidJobCounts[corePlayer.job] || 0) + 1;
            }

            // 步驟 B: 依序填滿至多 6 人 (依配額與規則過濾)
            let i = 0;
            while (currentTeam.length < 6 && i < pool.length) {
                const player = pool[i];
                if (canAddPlayer(player)) {
                    const addedPlayer = pool.splice(i, 1)[0];
                    currentTeam.push(addedPlayer);
                    singleTeamJobCounts[addedPlayer.job] = (singleTeamJobCounts[addedPlayer.job] || 0) + 1;
                    raidJobCounts[addedPlayer.job] = (raidJobCounts[addedPlayer.job] || 0) + 1;
                } else {
                    i++;
                }
            }

            // 步驟 C: 檢查隊伍缺少的條件並產生備註提示
            let missingNotes = [];
            const hasMelee = currentTeam.some(p => p.job === "英雄" || p.job === "刀賊");
            if (!hasMelee) {
                missingNotes.push("尚缺：英雄/刀賊");
            }
            if (currentTeam.length < 6) {
                missingNotes.push(`尚缺 ${6 - currentTeam.length} 人`);
            }

            teams.push({
                players: currentTeam,
                missingNote: missingNotes.join("； ")
            });
        }

        // 剩餘無法入隊或超過上限的人員，全部歸類為替補
        return {
            teams: teams,
            backups: pool
        };
    }
</script>
