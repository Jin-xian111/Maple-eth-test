<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓之谷遠征隊 - 即時同步報名與組隊系統</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .status-bar {
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 15px;
            padding: 6px;
            border-radius: 6px;
            background-color: #e3f2fd;
            color: #0d47a1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            background: #fff;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .checkbox-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1976D2;
        }
        .btn-danger {
            background-color: #f44336;
            width: auto;
            padding: 6px 12px;
            font-size: 0.85em;
        }
        .btn-danger:hover {
            background-color: #d32f2f;
        }
        .btn-clear-all {
            background-color: #e53935;
            float: right;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f1f3f5;
        }
        .team-box {
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f9fbf9;
        }
        .team-title {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .clear {
            clear: both;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>楓之谷遠征隊報名與自動組隊系統</h1>
    <div class="status-bar" id="syncStatus">🔄 正在連線至雲端資料庫...</div>

    <!-- 1. 報名表單 -->
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h2>1. 填寫報名資料</h2>
        <div class="form-group">
            <label for="playerName">玩家暱稱：</label>
            <input type="text" id="playerName" placeholder="請輸入遊戲名稱">
        </div>
        <div class="form-group">
            <label for="playerLevel">玩家等級：</label>
            <input type="number" id="playerLevel" placeholder="請輸入等級 (例如: 150)" min="1" max="300">
        </div>
        <div class="form-group">
            <label for="playerJob">職業：</label>
            <select id="playerJob">
                <option value="主教">主教</option>
                <option value="英雄">英雄</option>
                <option value="黑騎士">黑騎士</option>
                <option value="聖騎士">聖騎士</option>
                <option value="箭神">箭神</option>
                <option value="神射手">神射手</option>
                <option value="刺客">刺客</option>
                <option value="刀賊">刀賊</option>
                <option value="拳霸">拳霸</option>
                <option value="槍神">槍神</option>
                <option value="火毒">火毒</option>
                <option value="冰雷">冰雷</option>
            </select>
        </div>
        <div class="form-group">
            <label>可參加日期：</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="timeSlot" value="週一"> 週一</label>
                <label><input type="checkbox" name="timeSlot" value="週二"> 週二</label>
                <label><input type="checkbox" name="timeSlot" value="週三"> 週三</label>
                <label><input type="checkbox" name="timeSlot" value="週四"> 週四</label>
                <label><input type="checkbox" name="timeSlot" value="週五"> 週五</label>
                <label><input type="checkbox" name="timeSlot" value="週六"> 週六</label>
                <label><input type="checkbox" name="timeSlot" value="週日"> 週日</label>
            </div>
        </div>
        <button onclick="submitRegistration()">提交報名</button>
    </div>

    <!-- 2. 目前報名名單 -->
    <div>
        <button class="btn-danger btn-clear-all" onclick="clearAllData()">🗑️ 清空所有名單 (需密碼)</button>
        <h2 style="text-align: left;">2. 目前報名名單 (共 <span id="playerCount">0</span> 人)</h2>
        <div class="clear"></div>
        <table>
            <thead>
                <tr>
                    <th>序號</th>
                    <th>玩家暱稱</th>
                    <th>等級</th>
                    <th>職業</th>
                    <th>可參加日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                <tr><td colspan="6">載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 3. 自動組隊功能 -->
    <div style="margin-top: 30px;">
        <h2>3. 自動組隊分析</h2>
        <button style="background-color: #4CAF50;" onclick="generateTeams()">產生最佳組隊名單</button>
        <div id="teamResults" style="margin-top: 20px;"></div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBs2AIpmqDMMNvIuLBr2fjCbDTzbED3XCM",
        authDomain: "maple-test-a3ba4.firebaseapp.com",
        databaseURL: "https://maple-test-a3ba4-default-rtdb.firebaseio.com",
        projectId: "maple-test-a3ba4",
        storageBucket: "maple-test-a3ba4.firebasestorage.app",
        messagingSenderId: "352071996272",
        appId: "1:352071996272:web:2aae58f9118c82aeba35b5",
        measurementId: "G-G4JG7VH65R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, 'maple_players');

    let players = [];

    onValue(playersRef, (snapshot) => {
        const data = snapshot.val();
        players = data ? data : [];
        updateUI();
        document.getElementById('syncStatus').innerText = "🟢 已與雲端資料庫同步（即時連線中）";
        document.getElementById('syncStatus').style.backgroundColor = "#e8f5e9";
        document.getElementById('syncStatus').style.color = "#2e7d32";
    }, (error) => {
        console.error("Firebase Sync Error:", error);
        document.getElementById('syncStatus').innerText = "🔴 連線失敗，請檢查 Realtime Database 開通設定";
        document.getElementById('syncStatus').style.backgroundColor = "#ffebee";
        document.getElementById('syncStatus').style.color = "#c62828";
    });

    function saveToFirebase(newPlayers) {
        set(playersRef, newPlayers);
    }

    window.submitRegistration = function() {
        const nameInput = document.getElementById('playerName');
        const levelInput = document.getElementById('playerLevel');
        const name = nameInput.value.trim();
        const level = levelInput.value.trim();
        const job = document.getElementById('playerJob').value;
        const timeBoxes = document.querySelectorAll('input[name="timeSlot"]:checked');
        
        const times = Array.from(timeBoxes).map(cb => cb.value);

        if (!name) {
            alert("請輸入玩家暱稱！");
            return;
        }
        if (!level) {
            alert("請輸入玩家等級！");
            return;
        }
        if (times.length === 0) {
            alert("請至少選擇一個可參加日期！");
            return;
        }

        const newPlayer = { name, level, job, times };
        const updatedPlayers = [...players, newPlayer];
        
        saveToFirebase(updatedPlayers);

        nameInput.value = '';
        levelInput.value = '';
        timeBoxes.forEach(cb => cb.checked = false);
    };

    window.deletePlayer = function(index) {
        if (confirm(`確定要刪除 ${players[index].name} 嗎？`)) {
            const updatedPlayers = players.filter((_, i) => i !== index);
            saveToFirebase(updatedPlayers);
        }
    };

    window.clearAllData = function() {
        const passphrase = prompt("請輸入重置金鑰/密碼以清空名單：");
        if (passphrase === "SMD") {
            if (confirm("確認要清空所有已報名的玩家資料嗎？此操作無法復原！")) {
                saveToFirebase([]);
            }
        } else if (passphrase !== null) {
            alert("密碼錯誤！無法清空資料。");
        }
    };

    function updateUI() {
        const tbody = document.getElementById('playerTableBody');
        document.getElementById('playerCount').innerText = players.length;
        tbody.innerHTML = '';

        if (players.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">目前尚無人報名</td></tr>';
            return;
        }

        players.forEach((p, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(p.name)}</td>
                <td>Lv.${escapeHtml(p.level || '-')}</td>
                <td>${escapeHtml(p.job)}</td>
                <td>${p.times.join(', ')}</td>
                <td><button class="btn-danger" onclick="deletePlayer(${index})">刪除</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }

    window.generateTeams = function() {
        const resultsDiv = document.getElementById('teamResults');
        resultsDiv.innerHTML = '';

        if (players.length === 0) {
            resultsDiv.innerHTML = '<p style="color: red;">目前沒有報名名單可供組隊！</p>';
            return;
        }

        const days = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"];

        days.forEach(day => {
            const slotPlayers = players.filter(p => p.times.includes(day));
            if (slotPlayers.length === 0) return;

            const teams = buildTeamsForSlot(slotPlayers);

            let html = `<div class="team-box">
                <div class="team-title">📅 日期：${day} (該日共 ${slotPlayers.length} 人報名)</div>`;

            if (teams.length === 0) {
                html += `<p>人數不足（未滿 6 人）無法組隊。</p>`;
            } else {
                teams.forEach((team, tIdx) => {
                    html += `<p><strong>隊伍 ${tIdx + 1} (6人)：</strong> ${team.map(p => `${p.name} (Lv.${p.level || '-'} ${p.job})`).join('、 ')}</p>`;
                });
                const totalAssigned = teams.length * 6;
                if (slotPlayers.length > totalAssigned) {
                    const leftovers = slotPlayers.slice(totalAssigned);
                    html += `<p style="color: #666; font-size: 0.9em;">替補/未入隊 (${leftovers.length}人)：${leftovers.map(p => `${p.name} (Lv.${p.level || '-'} ${p.job})`).join('、 ')}</p>`;
                }
            }

            html += `</div>`;
            resultsDiv.innerHTML += html;
        });
    };

    function buildTeamsForSlot(availablePlayers) {
        let pool = [...availablePlayers];
        let teams = [];

        while (pool.length >= 6) {
            let currentTeam = [];
            
            let bishopIdx = pool.findIndex(p => p.job === "主教");
            if (bishopIdx !== -1) {
                currentTeam.push(pool.splice(bishopIdx, 1)[0]);
            }

            while (currentTeam.length < 6 && pool.length > 0) {
                currentTeam.push(pool.shift());
            }

            if (currentTeam.length === 6) {
                teams.push(currentTeam);
            } else {
                break;
            }
        }
        return teams;
    }
</script>

</body>
</html>
